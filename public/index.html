<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cookie Repo</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{color-scheme:light}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:15px}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: sticky enamel-blue tab bar over a cool flour-white bench; recipe cards in a grid, bake day as a lane chart + agenda, shopping list grouped by aisle. */
:root{
  --bg:#f1f3f6; --surface:#ffffff; --surface-2:#f6f7f9; --ink:#1b2230; --muted:#5a6373; --line:#dbe0e7;
  --accent:#1d4ea6; --accent-ink:#ffffff; --accent-soft:#e3eaf8;
  --sugar:#94551f; --sugar-soft:#f5e9dc;
  --good:#2b7949; --good-soft:#e1f1e7; --warn:#9c5c0c; --warn-soft:#fbeedb; --bad:#b3372e; --bad-soft:#f8e3e1;
  --c1:#1d4ea6; --c2:#c0662b; --c3:#2c8a5f; --c4:#8a46a8; --c5:#c23d5e; --c6:#2f8db0;
  --shadow:0 1px 2px rgba(20,32,56,.06),0 6px 18px rgba(20,32,56,.06);
  --overlay:rgba(16,22,34,.45);
  --f-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1319; --surface:#171d26; --surface-2:#1c2330; --ink:#e6eaf0; --muted:#97a1b1; --line:#2a3340;
  --accent:#88aaee; --accent-ink:#0d1420; --accent-soft:#1d2a43;
  --sugar:#dca06a; --sugar-soft:#33271c;
  --good:#6cc08e; --good-soft:#1b3125; --warn:#e2a650; --warn-soft:#37291a; --bad:#ef7a70; --bad-soft:#3a1f1d;
  --c1:#88aaee; --c2:#e89c66; --c3:#6cc08e; --c4:#c58fe2; --c5:#ef81a0; --c6:#72c2df;
  --shadow:0 1px 2px rgba(0,0,0,.3); --overlay:rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f1319; --surface:#171d26; --surface-2:#1c2330; --ink:#e6eaf0; --muted:#97a1b1; --line:#2a3340;
  --accent:#88aaee; --accent-ink:#0d1420; --accent-soft:#1d2a43;
  --sugar:#dca06a; --sugar-soft:#33271c;
  --good:#6cc08e; --good-soft:#1b3125; --warn:#e2a650; --warn-soft:#37291a; --bad:#ef7a70; --bad-soft:#3a1f1d;
  --c1:#88aaee; --c2:#e89c66; --c3:#6cc08e; --c4:#c58fe2; --c5:#ef81a0; --c6:#72c2df;
  --shadow:0 1px 2px rgba(0,0,0,.3); --overlay:rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15;letter-spacing:-.01em}
h1{font-size:1.75rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--muted)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-size:1.3rem;letter-spacing:-.02em}
.tabs{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.tab{border:0;background:none;padding:6px 14px;border-radius:999px;cursor:pointer;font-weight:600;color:var(--muted);display:flex;gap:6px;align-items:center;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tab .ct{font-family:var(--f-mono);font-size:.75rem;opacity:.85}
@media (max-width:640px){ .brand{margin-right:0;width:100%} .tabs{width:100%} .tab{flex:1;justify-content:center;padding:6px 8px} }

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:.9rem;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.solid{background:var(--bad);color:var(--surface)}
.btn:disabled{opacity:.55;cursor:default}
.btn.sm{padding:4px 9px;font-size:.82rem}

main{padding-block:24px 64px;display:flex;flex-direction:column;gap:20px}
.page-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.page-head > div{margin-right:auto;min-width:0}
.page-head p{margin-top:4px}
.banner{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 14px;font-size:.9rem}
.banner.warn{background:var(--warn-soft);border-color:transparent;color:var(--ink)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.temp{background:var(--sugar-soft);border-color:transparent;color:var(--sugar)}
.chip.chill{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.chip.ex{background:none;border-style:dashed}
.chip.ok{background:var(--good-soft);color:var(--good);border-color:transparent}

/* recipe grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;min-width:0}
.card:hover{border-color:var(--accent)}
.card.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.card-top{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.card h3{min-width:0;overflow-wrap:anywhere}
.card-foot{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:4px}
.card-foot .muted{font-size:.82rem;margin-right:auto}
.toggle{border:1px solid var(--accent);color:var(--accent);background:none;border-radius:999px;padding:4px 11px;font-weight:600;font-size:.82rem;cursor:pointer;white-space:nowrap}
.toggle[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:32px 20px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.empty p{max-width:52ch}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.panel-head h2{margin-right:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:820px){ .two{grid-template-columns:1fr} }

/* plan settings */
.settings{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field input,.field select,.field textarea,.inp{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 9px;min-width:0}
.field textarea{resize:vertical}
.check{display:flex;gap:8px;align-items:center;cursor:pointer;font-size:.9rem}
.check input{width:17px;height:17px;accent-color:var(--accent)}

.sel-list{display:flex;flex-direction:column}
.sel-row{display:grid;grid-template-columns:14px 1fr auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.sel-row:first-child{border-top:0}
.sel-row .nm{font-weight:600;min-width:0;overflow-wrap:anywhere}
.sel-row .sub{font-size:.8rem;color:var(--muted)}
.dot{width:12px;height:12px;border-radius:3px;display:inline-block}
.summary{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:.92rem}
.summary b{font-family:var(--f-mono);font-size:1.05rem}

.task{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:10px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.task .when{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);padding-top:1px;min-width:72px}
.task p{min-width:0}
.task .sub{grid-column:2;font-size:.85rem;color:var(--muted)}
.tempgroup{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.tempgroup:first-of-type{border-top:0}
.tempgroup .deg{font-family:var(--f-mono);font-weight:500;color:var(--sugar);background:var(--sugar-soft);border-radius:6px;padding:2px 8px;white-space:nowrap}

/* lane chart */
.chart-scroll{overflow-x:auto}
.lanes{min-width:620px;display:grid;grid-template-columns:150px 1fr;row-gap:6px;font-size:.78rem}
.lane-label{font-weight:600;padding-right:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;align-self:center;display:flex;align-items:center;gap:6px}
.track{position:relative;height:26px;background:var(--surface-2);border-radius:5px}
.bar{position:absolute;top:3px;bottom:3px;border-radius:4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 5px;line-height:20px;font-weight:600;color:var(--surface)}
.bar.mix{background:var(--ink)}
.bar.chill{background:repeating-linear-gradient(135deg,var(--accent-soft) 0 5px,transparent 5px 9px);border:1px solid var(--accent);color:var(--accent)}
.bar.cool{background:var(--line);color:var(--muted)}
.bar.deco{background:var(--sugar-soft);color:var(--sugar);border:1px solid var(--sugar)}
.bar.heat{background:var(--sugar-soft);color:var(--sugar)}
.ticks{position:relative;height:18px;color:var(--muted);font-family:var(--f-mono);font-size:.7rem}
.ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* shopping */
.shop-cat{display:flex;flex-direction:column}
.shop-cat h3{font-size:.95rem;padding:14px 0 6px;color:var(--sugar)}
.shop-row{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.shop-row input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--good)}
.shop-row .it{font-weight:600;min-width:0;overflow-wrap:anywhere}
.shop-row .from{font-size:.78rem;color:var(--muted)}
.shop-row .amt{font-family:var(--f-mono);font-size:.85rem;text-align:right}
.shop-row .hint{display:block;font-family:var(--f-body);font-size:.76rem;color:var(--muted)}
.shop-row.have .it,.shop-row.have .amt{text-decoration:line-through;color:var(--muted)}

/* modal */
.modal{position:fixed;inset:0;z-index:20;background:var(--overlay);display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);border-radius:14px;width:100%;max-width:780px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0}
.sheet-head{display:flex;gap:12px;align-items:flex-start;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.sheet-head > div{margin-right:auto;min-width:0}
.sheet-head h2{font-size:1.45rem;overflow-wrap:anywhere}
.sheet-body{padding:16px 20px 20px;display:flex;flex-direction:column;gap:18px}
.x{border:0;background:none;font-size:1.4rem;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px;border-radius:6px}
.x:hover{background:var(--surface-2);color:var(--ink)}
.ing{list-style:none;padding:0;margin:0;display:flex;flex-direction:column}
.ing li{display:grid;grid-template-columns:110px 1fr;gap:10px;padding:6px 0;border-top:1px dashed var(--line)}
.ing li:first-child{border-top:0}
.ing .q{font-family:var(--f-mono);font-size:.88rem;text-align:right;color:var(--sugar)}
.steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:8px}
.notes{display:flex;flex-direction:column;gap:8px}
.note{background:var(--warn-soft);border-radius:8px;padding:9px 12px;display:flex;flex-direction:column;gap:2px}
.note .d{font-size:.75rem;color:var(--warn);font-weight:600}
.note p{white-space:pre-wrap;overflow-wrap:anywhere}
.scale-box{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--surface-2);border-radius:8px;padding:10px 12px}
.scale-box .out{font-weight:600}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bad-soft);border-radius:8px;padding:10px 12px}

.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.drop{border:2px dashed var(--line);border-radius:10px;padding:22px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs{border-radius:10px;padding:2px}
.thumbs.over{background:var(--accent-soft)}
.thumb{margin:0;display:flex;flex-direction:column;gap:4px;align-items:center}
.thumb img{width:96px;height:120px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.thumb figcaption{font-size:.78rem;font-weight:600;color:var(--muted)}
.thumb-acts{display:flex;gap:4px}
.thumb-acts a.btn{text-decoration:none;color:inherit}
.thumb a{display:block;line-height:0}
.banner.relink{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.note-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.note.editing textarea{width:100%;margin-top:4px}
.search-bar{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;margin:4px 0 14px}
.search-bar #recipe-q{flex:1 1 260px;font-size:1rem;padding:9px 12px}
.card .why{font-size:.82rem;color:var(--muted);overflow-wrap:anywhere}
.bake-tabs{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch;margin:2px 0 14px}
.bake-tab{display:flex;flex-direction:column;align-items:flex-start;gap:1px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.bake-tab span{font-size:.78rem;color:var(--muted)}
.bake-tab[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);cursor:default}
.bake-tabs > .btn{align-self:center}
.bake-row.kid{padding-left:22px;position:relative}
.bake-row.kid::before{content:"↳";position:absolute;left:4px;top:12px;color:var(--muted)}
.shop-scope{margin:4px 0 12px}
.shop-pick{display:flex;flex-wrap:wrap;gap:8px 18px;margin-bottom:12px}
@media (max-width:640px){.person{grid-template-columns:1fr 1fr}.person .em{grid-column:1/-1;order:-1}}
.chip.dupe{background:var(--warn-soft);color:var(--warn);border-color:transparent;align-self:flex-start}
.dupe-banner{display:flex;flex-direction:column;gap:8px;align-items:flex-start;background:var(--warn-soft);border-color:transparent}
.origin{display:flex;flex-direction:column;gap:4px}
.origin-line{display:flex;gap:8px;align-items:center;flex-wrap:wrap;overflow-wrap:anywhere}
.link-form{display:flex;gap:6px;flex-wrap:wrap;width:100%}
.link-form .inp{flex:1 1 260px}
.task.warn{background:var(--warn-soft);border-radius:8px;padding-left:8px}
.who-box{display:flex;flex-direction:column;gap:0;margin-bottom:6px}
.who-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.who-row .nm{font-weight:700}
.who-row .sub{font-size:.85rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px;align-items:center}
.who-row .sub .dot{margin-right:-6px}
.who-row.unassigned .nm{color:var(--warn)}
.who-row.on{background:var(--accent-soft);border-radius:8px;padding-left:8px;padding-right:8px}
.help{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;margin:0 2px;padding:0;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:700 11px/1 system-ui,sans-serif;cursor:help;vertical-align:middle;text-transform:none;letter-spacing:0;flex:none;position:relative}
.help::after{content:"";position:absolute;inset:-6px}
.help:hover,.help:focus-visible,.help[aria-describedby]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
#help-tip{position:fixed;z-index:60;background:var(--ink);color:var(--bg);font:500 .84rem/1.45 system-ui,-apple-system,sans-serif;padding:8px 11px;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.18);pointer-events:none;text-transform:none;letter-spacing:0}
#print-root{display:none}
.pr{font:11pt/1.45 Georgia,"Times New Roman",serif;color:#000;max-width:7.5in}
.pr h1{font-size:21pt;line-height:1.15;margin:0 0 4pt}
.pr .meta{font:9.5pt/1.4 -apple-system,system-ui,sans-serif;color:#333;margin:0 0 3pt}
.pr .src{font:9pt/1.4 -apple-system,system-ui,sans-serif;color:#333;margin:0 0 10pt;overflow-wrap:anywhere}
.pr h2{font:700 9pt/1.2 -apple-system,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.08em;margin:14pt 0 5pt;color:#333}
.pr .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:20pt}
.pr ul.ing{list-style:none;padding:0;margin:0}
.pr ul.ing li{display:grid;grid-template-columns:5.6em minmax(0,1fr);gap:6pt;padding:2.5pt 0;border-bottom:.5pt solid #ddd;break-inside:avoid}
.pr ul.ing .q{font:700 10.5pt/1.45 Georgia,"Times New Roman",serif;color:#000;white-space:nowrap;text-align:left}
.pr ol{margin:0;padding-left:15pt}
.pr ol li{margin:0 0 5pt;break-inside:avoid}
.pr .note{border-left:2pt solid #bbb;padding:1pt 0 1pt 7pt;margin:0 0 6pt;break-inside:avoid}
.pr .note small{display:block;color:#555;font:8.5pt -apple-system,system-ui,sans-serif}
.pr .foot{margin-top:16pt;padding-top:4pt;border-top:.5pt solid #bbb;font:8pt -apple-system,system-ui,sans-serif;color:#666}
@media print{
  @page{margin:13mm}
  html,body{background:#fff !important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body.printing-recipe > *:not(#print-root){display:none !important}
  body.printing-recipe #print-root{display:block}
  body.printing-page header.top,body.printing-page #modal,body.printing-page #toast,body.printing-page .btn,body.printing-page .toggle,body.printing-page .no-print,body.printing-page .bake-tabs,body.printing-page .banner,body.printing-page .x,.help,#help-tip{display:none !important}
  body.printing-page .panel{box-shadow:none;border:1px solid #ccc;break-inside:avoid-page}
  body.printing-page .task{break-inside:avoid}
  body.printing-page select{appearance:none;-webkit-appearance:none;border:0;background:none;padding:0;font-weight:600}
}
.sugg{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.sugg .nm{font-weight:700}
.sugg .sub{font-size:.86rem}
.sugg-acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.move-sel{max-width:170px}
@media (max-width:640px){.sugg{grid-template-columns:1fr}.sugg-acts{justify-content:flex-start}}
.photo-btns{display:flex;gap:8px;flex-wrap:wrap}
.photo-btns label.btn{cursor:pointer}
.status{display:flex;gap:10px;align-items:center;font-size:.9rem;padding:10px 12px;border-radius:8px;background:var(--surface-2)}
.status.err{background:var(--bad-soft);color:var(--ink)}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:sp 0.8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}

/* editor */
.form-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.form-grid .wide{grid-column:span 2}
.form-grid .full{grid-column:1/-1}
@media (max-width:640px){ .form-grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
.ing-edit{display:flex;flex-direction:column;gap:6px}
.ing-row{display:grid;grid-template-columns:70px 84px minmax(0,1fr) minmax(0,.8fr) 130px 30px;gap:6px;align-items:center}
.ing-row input,.ing-row select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 7px;min-width:0;width:100%;font-size:.88rem}
.ing-head{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
@media (max-width:700px){ .ing-row{grid-template-columns:60px 76px minmax(0,1fr) 30px} .ing-row .opt{display:none} }
.sheet-foot{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}

/* sign in */
.signed-out .tabs{display:none}
.login{max-width:420px;margin:8vh auto 0;width:100%}
.login form{display:flex;flex-direction:column;gap:12px}
.login input{font-size:1.05rem;padding:10px 12px}
.login .code{font-family:var(--f-mono);letter-spacing:.3em;font-size:1.4rem;text-align:center}
/* people & filters */
.bake-name{flex:1 1 220px}
.bake-name .inp{width:100%}
#p-notes{width:100%;resize:vertical}
.bake-form{display:flex;flex-direction:column;gap:12px;margin:0}
.bake-form h3{font-size:1.05rem}
.bake-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.bake-row .nm{font-weight:700}
.bake-row .sub{font-size:.85rem;color:var(--muted);overflow-wrap:anywhere}
.bake-row .confirm{grid-column:1/-1}
.bake-acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:560px){.bake-row{grid-template-columns:1fr}.bake-acts{justify-content:flex-start}}
.person{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.person:first-of-type{border-top:0}
.person .em{font-size:.85rem;color:var(--muted);overflow-wrap:anywhere}
.person input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 9px;min-width:0}
.add-person{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:10px}
@media (max-width:560px){ .person,.add-person{grid-template-columns:1fr} }
.who{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted)}
.who select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 8px}
.baker{font-size:.75rem;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 8px;margin-left:6px;white-space:nowrap}
.sel-row{grid-template-columns:14px 1fr auto auto auto}
@media (max-width:640px){ .sel-row{grid-template-columns:14px 1fr;} .sel-row > select,.sel-row > .who,.sel-row > button{grid-column:2} }
.task.dim{opacity:.4}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:600;font-size:.9rem;max-width:calc(100% - 32px)}
</style>
</head>

  <div class="wrap top-in">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="var(--sugar-soft)" stroke="var(--sugar)" stroke-width="2"/><circle cx="11" cy="12" r="2" fill="var(--sugar)"/><circle cx="19" cy="10" r="1.6" fill="var(--sugar)"/><circle cx="20" cy="19" r="2.2" fill="var(--sugar)"/><circle cx="12" cy="20" r="1.5" fill="var(--sugar)"/></svg>
      <b>Cookie Repo</b>

    <nav class="tabs" role="tablist" id="tabs">
